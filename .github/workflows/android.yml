name: Android Release Test Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable release APK for testing
        run: gradle assembleRelease
      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAN-SUBSYNC-AI-release-test
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: SHAN SUBSYNC AI Test Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Testing build for SHAN SUBSYNC AI.
            This is a test release, not a production release.
